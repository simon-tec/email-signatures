<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeGuardian Email Signature Generator</title>
  <!-- Tailwind CSS for styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    /* Hide scrollbar for a cleaner look */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-blue-900 flex items-center justify-center text-white shadow-md">
          <i class="fa-solid fa-shield text-blue-400 text-lg"></i>
        </div>
        <div>
          <h1 class="text-base font-bold text-slate-900 leading-none">SafeGuardian Signature Studio</h1>
          <p class="text-xs text-slate-500 mt-0.5">Standalone HTML Edition</p>
        </div>
      </div>
      <button onclick="copyVisual()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition-all shadow-sm flex items-center gap-2">
        <i class="fa-regular fa-copy"></i> Copy for Email
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 w-full grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <!-- Controls Sidebar -->
    <div class="lg:col-span-5 flex flex-col gap-6" id="controls">
      
      <!-- Layout & Client -->
      <div class="bg-white rounded-xl p-5 border border-slate-200 shadow-sm space-y-4">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 border-b pb-2">Layout & Platform</h2>
        
        <div class="grid grid-cols-2 gap-2 text-xs">
          <label class="flex items-center gap-2 p-2 border rounded cursor-pointer hover:bg-slate-50"><input type="radio" name="layout" value="split" checked onchange="update()"> Split</label>
          <label class="flex items-center gap-2 p-2 border rounded cursor-pointer hover:bg-slate-50"><input type="radio" name="layout" value="stacked" onchange="update()"> Stacked</label>
          <label class="flex items-center gap-2 p-2 border rounded cursor-pointer hover:bg-slate-50"><input type="radio" name="layout" value="terminal-clean" onchange="update()"> Terminal (Clean)</label>
          <label class="flex items-center gap-2 p-2 border rounded cursor-pointer hover:bg-slate-50"><input type="radio" name="layout" value="terminal-code" onchange="update()"> Terminal (Code)</label>
          <label class="flex items-center gap-2 p-2 border rounded cursor-pointer hover:bg-slate-50"><input type="radio" name="layout" value="banner-html" onchange="update()"> Banner (HTML)</label>
          <label class="flex items-center gap-2 p-2 border rounded cursor-pointer hover:bg-slate-50"><input type="radio" name="layout" value="banner-img" onchange="update()"> Banner (Image)</label>
        </div>

        <div class="pt-2 border-t mt-2 grid grid-cols-2 gap-2 text-xs">
          <label class="flex items-center gap-2 p-2 border rounded cursor-pointer bg-blue-50 border-blue-200"><input type="radio" name="client" value="gmail" checked onchange="update()"> Gmail / Web</label>
          <label class="flex items-center gap-2 p-2 border rounded cursor-pointer"><input type="radio" name="client" value="outlook" onchange="update()"> Outlook (MSO)</label>
        </div>
      </div>

      <!-- User Details -->
      <div class="bg-white rounded-xl p-5 border border-slate-200 shadow-sm space-y-3 text-sm">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 border-b pb-2">Personal Details</h2>
        
        <div class="grid grid-cols-2 gap-3">
          <div><label class="block text-xs text-slate-600 mb-1">Full Name</label><input type="text" id="name" value="Alex Morgan" oninput="update()" class="w-full p-2 border rounded text-xs"></div>
          <div><label class="block text-xs text-slate-600 mb-1">Job Title</label><input type="text" id="title" value="Senior Security Advisor" oninput="update()" class="w-full p-2 border rounded text-xs"></div>
          <div><label class="block text-xs text-slate-600 mb-1">Company</label><input type="text" id="company" value="SafeGuardian" oninput="update()" class="w-full p-2 border rounded text-xs"></div>
          <div><label class="block text-xs text-slate-600 mb-1">Phone</label><input type="text" id="phone" value="+64 9 300 1234" oninput="update()" class="w-full p-2 border rounded text-xs"></div>
          <div><label class="block text-xs text-slate-600 mb-1">Email</label><input type="text" id="email" value="alex.morgan@safeguardian.co.nz" oninput="update()" class="w-full p-2 border rounded text-xs"></div>
          <div><label class="block text-xs text-slate-600 mb-1">Website</label><input type="text" id="website" value="https://safeguardian.co.nz" oninput="update()" class="w-full p-2 border rounded text-xs"></div>
          <div class="col-span-2"><label class="block text-xs text-slate-600 mb-1">LinkedIn URL</label><input type="text" id="linkedin" value="https://linkedin.com/company/safeguardian" oninput="update()" class="w-full p-2 border rounded text-xs"></div>
        </div>
      </div>

      <!-- Branding & Extras -->
      <div class="bg-white rounded-xl p-5 border border-slate-200 shadow-sm space-y-4 text-sm">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 border-b pb-2">Branding & Features</h2>
        
        <div class="grid grid-cols-2 gap-3">
          <div><label class="block text-xs text-slate-600 mb-1">Primary Color</label><input type="color" id="primaryColor" value="#1e3a8a" onchange="update()" class="w-full h-8 cursor-pointer"></div>
          <div><label class="block text-xs text-slate-600 mb-1">Accent Color</label><input type="color" id="accentColor" value="#2563eb" onchange="update()" class="w-full h-8 cursor-pointer"></div>
        </div>

        <div>
          <label class="block text-xs text-slate-600 mb-1">Font Family</label>
          <select id="fontSelect" onchange="update()" class="w-full p-2 border rounded text-xs">
            <option value="'Inter', sans-serif">Inter / Modern Sans</option>
            <option value="Aptos, 'Segoe UI', Arial, sans-serif">Aptos (Microsoft 365)</option>
            <option value="'Century Gothic', sans-serif">Century Gothic / Geometric</option>
            <option value="Arial, sans-serif">Arial / Standard</option>
            <option value="Calibri, Candara, sans-serif">Calibri / Candara</option>
          </select>
        </div>

        <!-- Toggles -->
        <div class="space-y-3 pt-2">
          <label class="flex items-start gap-2 text-xs"><input type="checkbox" id="showTags" checked onchange="update()" class="mt-0.5"> 
            <div><b>Show Service Tags</b><div class="grid grid-cols-2 gap-2 mt-1"><input type="text" id="tag1" value="Autonomous Pentesting" oninput="update()" class="p-1.5 border rounded"><input type="text" id="tag2" value="Horizon3.ai" oninput="update()" class="p-1.5 border rounded"></div></div>
          </label>
          <label class="flex items-start gap-2 text-xs"><input type="checkbox" id="showCta" checked onchange="update()" class="mt-0.5"> 
            <div class="w-full"><b>Show CTA Button</b><input type="text" id="ctaText" value="🔒 Schedule a Security Audit" oninput="update()" class="w-full mt-1 p-1.5 border rounded"></div>
          </label>
          <label class="flex items-start gap-2 text-xs"><input type="checkbox" id="showTip" checked onchange="update()" class="mt-0.5"> 
            <div class="w-full"><b>Show Footer Tip</b><input type="text" id="tipText" value="Security tip: verify unexpected payment or login requests by phone before acting." oninput="update()" class="w-full mt-1 p-1.5 border rounded"></div>
          </label>
          <label class="flex items-center gap-2 text-xs"><input type="checkbox" id="showDisclaimer" onchange="update()"> Show Legal Disclaimer</label>
        </div>
      </div>
    </div>

    <!-- Preview Area -->
    <div class="lg:col-span-7 flex flex-col gap-4">
      <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="bg-slate-50 px-4 py-2 border-b flex justify-between items-center text-xs">
          <span class="font-semibold text-slate-500">Live Visual Preview</span>
          <button onclick="toggleSource()" class="text-blue-600 hover:underline">View Source HTML</button>
        </div>
        <div class="p-8 bg-slate-100 min-h-[400px] flex items-center justify-center">
          <div class="bg-white p-6 shadow-lg rounded-xl w-full max-w-2xl border" id="previewContainer"></div>
        </div>
      </div>
      
      <div id="sourcePanel" class="hidden bg-slate-900 rounded-xl border shadow-sm overflow-hidden">
        <div class="bg-slate-800 px-4 py-2 flex justify-between items-center text-xs text-white">
          <span class="font-mono">HTML Source Code</span>
          <button onclick="copyCode()" class="text-blue-400 hover:text-blue-300"><i class="fa-solid fa-copy"></i> Copy Code</button>
        </div>
        <textarea id="codeArea" class="w-full h-64 bg-slate-900 text-blue-300 font-mono text-xs p-4 outline-none resize-none" readonly></textarea>
      </div>
    </div>
  </main>

  <script>
    const LOGO = "https://images.squarespace-cdn.com/content/v1/66ac485ffc91f22009fa5c2b/f2ecda1d-b26a-46b6-a117-e90c7c274c43/SafeGuardian-logo.png";
    const LOGO_W = 140;

    function getVal(id) { return document.getElementById(id).value; }
    function getChecked(id) { return document.getElementById(id).checked; }
    function getRadio(name) { return document.querySelector(`input[name="${name}"]:checked`).value; }

    function generate() {
      const state = {
        layout: getRadio('layout'),
        client: getRadio('client'),
        name: getVal('name'),
        title: getVal('title'),
        company: getVal('company'),
        phone: getVal('phone'),
        email: getVal('email'),
        website: getVal('website'),
        linkedin: getVal('linkedin'),
        font: getVal('fontSelect'),
        pri: getVal('primaryColor'),
        acc: getVal('accentColor'),
        sec: '#475569',
        tag1: getVal('tag1'),
        tag2: getVal('tag2'),
        showTags: getChecked('showTags'),
        ctaText: getVal('ctaText'),
        showCta: getChecked('showCta'),
        tip: getVal('tipText'),
        showTip: getChecked('showTip'),
        showDisc: getChecked('showDisclaimer')
      };

      const cleanWeb = state.website.replace(/^https?:\/\//i, '');
      const isMso = state.client === 'outlook';

      const ctaHtml = state.showCta ? `<table cellpadding="0" cellspacing="0" border="0" style="margin-top: 12px;"><tr><td style="background-color: ${state.acc}; border-radius: 4px; padding: 6px 14px; text-align: center; border: 2px solid ${state.pri};"><a href="${state.website}" style="font-family: ${state.font}; font-size: 11px; font-weight: bold; color: #ffffff; text-decoration: none; display: inline-block;">${state.ctaText}</a></td></tr></table>` : '';
      const tipHtml = state.showTip ? `<div style="font-family: ${state.font}; font-size: 11px; color: #64748b; margin-top: 12px; font-style: italic;">${state.tip}</div>` : '';
      const discHtml = state.showDisc ? `<div style="font-family: ${state.font}; font-size: 10px; color: #94a3b8; margin-top: 10px; border-top: 1px solid #e2e8f0; padding-top: 10px;">CONFIDENTIALITY NOTICE: This email is confidential and may be privileged. If received in error, delete it immediately.</div>` : '';
      const tagsHtml = state.showTags ? `<table cellpadding="0" cellspacing="0" border="0" style="margin-top: 10px;"><tr>${state.tag1 ? `<td style="background-color: #f1f5f9; border: 1px solid ${state.pri}; border-radius: 12px; padding: 3px 10px; font-family: ${state.font}; font-weight: bold; font-size: 11px; color: ${state.pri};">${state.tag1}</td>` : ''}${state.tag1&&state.tag2?`<td width="6"></td>`:''}${state.tag2 ? `<td style="background-color: #f1f5f9; border: 1px solid ${state.pri}; border-radius: 12px; padding: 3px 10px; font-family: ${state.font}; font-weight: bold; font-size: 11px; color: ${state.pri};">${state.tag2}</td>` : ''}</tr></table>` : '';

      const contactHtml = `<table cellpadding="0" cellspacing="0" border="0" style="margin-top: 10px; font-size: 12px; font-family: ${state.font};">
        <tr><td style="padding-bottom:3px;"><strong style="color:${state.acc};">P:</strong> ${state.phone}</td></tr>
        <tr><td style="padding-bottom:3px;"><strong style="color:${state.acc};">E:</strong> <a href="mailto:${state.email}" style="color:${state.acc}; text-decoration:none;">${state.email}</a></td></tr>
        <tr><td style="padding-bottom:3px;"><strong style="color:${state.acc};">W:</strong> <a href="${state.website}" style="color:${state.acc}; text-decoration:none;">${cleanWeb}</a></td></tr>
        ${state.linkedin ? `<tr><td style="padding-bottom:3px;"><strong style="color:${state.acc};">in:</strong> <a href="${state.linkedin}" style="color:${state.acc}; text-decoration:none;">LinkedIn</a></td></tr>` : ''}
      </table>`;

      let core = '';

      if (state.layout === 'stacked') {
        core = `<table cellpadding="0" cellspacing="0" border="0" style="font-family: ${state.font}; font-size: 13px; color: ${state.pri};"><tr><td style="padding-bottom:15px;"><div style="font-size:18px; font-weight:bold;">${state.name}</div><div style="color:${state.sec};">${state.title}</div><div style="color:${state.acc}; font-weight:bold;">${state.company}</div></td></tr><tr><td style="border-top:3px solid ${state.pri}; padding-top:15px;">${contactHtml}${tagsHtml}<img src="${LOGO}" width="140" style="margin-top:12px; display:block;">${ctaHtml}</td></tr></table>`;
      } else if (state.layout === 'terminal-clean') {
        core = `<table cellpadding="0" cellspacing="0" border="0" style="font-family: ${state.font}; font-size: 13px; color: ${state.pri};"><tr><td style="padding-bottom:12px;"><img src="${LOGO}" width="140" style="display:block;"></td></tr><tr><td bgcolor="#f8fafc" style="background-color: #f8fafc; border-left: 3px solid ${state.acc}; padding: 12px 16px;"><div style="font-size:16px; font-weight:bold;">${state.name}</div><div style="font-size:12px; color:${state.sec}; margin-bottom:10px;">${state.title} &bull; ${state.company}</div><div style="font-family: monospace; font-size: 12px; line-height: 1.6;"><span style="color:${state.acc}; font-weight:bold;">&gt;</span> tel &nbsp;&nbsp;&nbsp;&nbsp; ${state.phone}<br/><span style="color:${state.acc}; font-weight:bold;">&gt;</span> email &nbsp;&nbsp; <a href="mailto:${state.email}" style="color:${state.pri}; text-decoration:none;">${state.email}</a><br/><span style="color:${state.acc}; font-weight:bold;">&gt;</span> web &nbsp;&nbsp;&nbsp;&nbsp; <a href="${state.website}" style="color:${state.pri}; text-decoration:none;">${cleanWeb}</a></div>${tagsHtml}${ctaHtml}</td></tr></table>`;
      } else if (state.layout === 'terminal-code') {
        core = `<table cellpadding="12" cellspacing="0" border="0" style="background-color:#0f172a; border-radius:6px; font-family: monospace; color:#cbd5e1; font-size:12px; width:480px;"><tr><td style="border-bottom:1px dashed #334155; padding-bottom:10px;"><span style="color:${state.acc};">guest@home:~$</span> whoami<br/><span style="color:#f8fafc; font-size:15px; font-weight:bold;">${state.name}</span><br/>${state.title}</td></tr><tr><td style="padding-top:10px;"><span style="color:${state.acc};">guest@home:~$</span> cat contact.json<br/><div style="color:#a5b4fc; padding-top:5px;">{<br/>&nbsp;&nbsp;"phone": "${state.phone}",<br/>&nbsp;&nbsp;"email": "${state.email}",<br/>&nbsp;&nbsp;"web": "${cleanWeb}"<br/>}</div>${state.showCta ? `<div style="margin-top:10px; color:${state.acc}; font-weight:bold;">> ${state.ctaText}</div>` : ''}</td></tr></table>`;
      } else if (state.layout === 'banner-html') {
        core = `<table cellpadding="0" cellspacing="0" border="0" style="font-family: ${state.font}; font-size: 13px; color: ${state.pri}; width: 480px;"><tr><td colspan="2"><table width="100%" cellpadding="0" cellspacing="0"><tr><td width="120" style="border-top: 4px solid ${state.acc};"></td><td style="border-top: 4px solid ${state.pri};"></td></tr></table></td></tr><tr><td colspan="2" style="padding: 16px 0 6px 0;"><img src="${LOGO}" width="140" style="display:block;"></td></tr><tr><td valign="top" style="padding: 10px 28px 0 0; width: 50%;"><div style="font-size: 18px; font-weight: bold; color: #1e293b;">${state.name}</div><div style="color: ${state.sec};">${state.title}</div><div style="font-weight: bold; margin-top: 2px;">${state.company}</div></td><td valign="top" style="padding: 10px 0 0 0; width: 50%;">${contactHtml}</td></tr>${state.showTags ? `<tr><td colspan="2">${tagsHtml}</td></tr>` : ''}${state.showCta ? `<tr><td colspan="2">${ctaHtml}</td></tr>` : ''}</table>`;
      } else {
        // Split & Banner Img
        let msoPre = isMso ? `<!--[if mso]><table role="presentation" border="0" cellspacing="0" cellpadding="0" width="520"><tr><td width="160" valign="top"><![endif]-->` : '';
        let msoMid = isMso ? `<!--[if mso]></td><td width="20"></td><td width="340" valign="top"><![endif]-->` : '';
        let msoPost = isMso ? `<!--[if mso]></td></tr></table><![endif]-->` : '';

        core = `${msoPre}<table cellpadding="0" cellspacing="0" border="0" style="font-family: ${state.font}; font-size: 13px; color: ${state.pri};"><tr><td valign="top" style="padding-right: 18px; border-right: 2px solid ${state.acc}; width: 140px;"><img src="${LOGO}" width="140" style="display:block;"></td>${msoMid}<td valign="top" style="padding-left: 18px;"><div style="font-size: 16px; font-weight: bold;">${state.name}</div><div style="font-size: 13px; color: ${state.sec}; margin-bottom: 2px;">${state.title}</div><div style="font-size: 12px; font-weight: bold; color: ${state.acc};">${state.company}</div>${contactHtml}${tagsHtml}${ctaHtml}</td></tr></table>${msoPost}`;

        if (state.layout === 'banner-img') {
           core += `<img src="https://placehold.co/520x100/1e3a8a/ffffff?text=Secure+Your+Enterprise+Today" width="520" style="margin-top:15px; display:block; max-width:100%; border-radius:6px;">`;
        }
      }

      return core + tipHtml + discHtml;
    }

    function update() {
      const html = generate();
      document.getElementById('previewContainer').innerHTML = html;
      document.getElementById('codeArea').value = html;
    }

    function copyVisual() {
      const el = document.getElementById('previewContainer');
      const selection = window.getSelection();
      const range = document.createRange();
      range.selectNodeContents(el);
      selection.removeAllRanges();
      selection.addRange(range);
      document.execCommand('copy');
      selection.removeAllRanges();
      alert("Formatted signature copied! Paste it directly into Gmail or Outlook.");
    }

    function copyCode() {
      const el = document.getElementById('codeArea');
      el.select();
      document.execCommand('copy');
      alert("Raw HTML source code copied!");
    }

    function toggleSource() {
      const panel = document.getElementById('sourcePanel');
      panel.classList.toggle('hidden');
    }

    // Init
    update();
  </script>
</body>
</html>
